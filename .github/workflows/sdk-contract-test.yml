# SDK contract test.
#   (A) the SDK committed here builds/type-checks
#   (B) the candidate SDK's requests are accepted by a mock of the latest spec
#       and the responses deserialize
#   (C) the latest release still round-trips against the latest spec
#
# Language-agnostic steps come from saasus-platform/github-actions; the build
# and harness steps stay here.
#
# pull_request, never pull_request_target: fork PRs do not receive the secrets.

name: SDK Contract Test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: sdk-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # This name is the required status check name. Do not rename.
  contract-test:
    name: contract-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR (candidate SDK)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 8
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up Node (for Prism)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # Short-lived, contents:read on the private api repo only.
      - name: Mint api read token
        id: api-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.SPEC_READER_APP_ID }}
          private-key: ${{ secrets.SPEC_READER_PRIVATE_KEY }}
          owner: Anti-Pattern-Inc
          repositories: saasus-api

      # The action resolves the api repository and its latest stable tag.
      - name: Fetch OpenAPI spec
        id: spec
        uses: saasus-platform/github-actions/.github/actions/fetch-openapi-spec@main
        with:
          token: ${{ steps.api-token.outputs.token }}

      # (A) Not regenerated: the committed code is the artifact that gets
      # released. The api repo's "Update SDK" workflow already runs generate.sh
      # (spec -> generate.sh -> build) when it opens the "Update API Client" PR,
      # so the pipeline is verified there.
      - name: (A) Build candidate SDK
        run: mvn -B -ntp -DskipTests test-compile

      # Static mode: responses come from the spec's examples, which is how the
      # API spec makes oneOf responses resolvable (saasus-api#2650); dynamic
      # mode would ignore them.
      - name: Start Prism mocks
        uses: saasus-platform/github-actions/.github/actions/setup-prism@main
        with:
          spec-dir: ${{ steps.spec.outputs.spec-dir }}
          modules: ${{ steps.spec.outputs.modules }}

      # (B) Candidate SDK spec-compliance via the stable `mvn test` entry point.
      # Base URLs come from the setup-prism step (PRISM_URL_<MODULE>), request
      # inputs from the spec in CONTRACT_SPEC_DIR.
      - name: (B) Candidate SDK contract
        env:
          CONTRACT_SPEC_DIR: ${{ steps.spec.outputs.spec-dir }}
          # Candidate SDK must cover every spec operation: unmapped operations fail.
          CONTRACT_REQUIRE_COMPLETE: "true"
        run: mvn -B -ntp test -Dtest=saasus.sdk.contract.**

      # Latest release tag; the action defaults to this repository.
      - name: Resolve latest release tag
        id: release-tag
        uses: saasus-platform/github-actions/.github/actions/resolve-latest-stable-tag@main

      - name: Checkout latest release
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.release-tag.outputs.tag }}
          path: latest-release

      # (C) Forward-compat: the release tag's OWN bundled suite is run (not a
      # copy of the current harness), so each release is checked with the test
      # it shipped with. Prism and CONTRACT_SPEC_DIR still point at the latest
      # spec.
      #
      # -Dtest names the suite because a bare `mvn test` also passes on a tag
      # bundling no suite (the generated model tests alone give BUILD SUCCESS);
      # surefire instead fails on the absent class, intended for a tag published
      # before the suite existed. The class name must stay stable across
      # generations.
      - name: (C) Latest release forward-compat (bundled suite)
        env:
          CONTRACT_SPEC_DIR: ${{ steps.spec.outputs.spec-dir }}
        run: |
          set -euo pipefail
          cd latest-release
          mvn -B -ntp test -Dtest=saasus.sdk.contract.**

      # Evidence of what ran: each case is a display name in the report.
      # Uploaded on failure too, where the (C) report can be absent because (B)
      # failed first — hence if-no-files-found: ignore.
      - name: Upload JUnit contract reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-test-reports
          path: |
            target/surefire-reports/**
            latest-release/target/surefire-reports/**
          if-no-files-found: ignore

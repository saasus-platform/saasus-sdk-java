# SDK contract test (A)(B)(C) calling workflow.
#
# This thin file lives in the SDK repository. The language-agnostic steps
# (fetch spec, start Prism, resolve the previous release tag) come from the
# central reusable repo saasus-platform/github-actions. The language-specific
# build/harness steps stay here.
#
# What it checks:
#   (A) the latest SDK generates from the current OpenAPI spec and builds/type-checks
#   (B) the latest SDK's requests are accepted by the mock and responses deserialize
#   (C) the previously released SDK still deserializes responses from the latest spec
#
# Security:
#   - pull_request only (never pull_request_target); fork PRs do not receive secrets.
#   - the job name below is fixed so it can be set as a required status check.
#   - the api read token and bearer tokens are masked; no response body, spec body
#     or PII is printed.
#
# NOTE: third-party and official actions are pinned by commit SHA (see the
# github-actions repo README "Pinning"); keep it that way when bumping them.

name: SDK Contract Test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: sdk-contract-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The job name "contract-test" is the required status check name. Do not rename.
  contract-test:
    name: contract-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MODULES: "auth pricing billing awsmarketplace integration apilog communication"
    steps:
      - name: Checkout PR (latest SDK)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 8
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "8"

      - name: Set up Node (for Prism via npx)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # Short-lived installation token (contents:read on the private api repo only).
      - name: Mint api read token
        id: api-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.SPEC_READER_APP_ID }}
          private-key: ${{ secrets.SPEC_READER_PRIVATE_KEY }}
          owner: Anti-Pattern-Inc
          repositories: saasus-api

      # api repository and its latest stable tag are resolved inside the action.
      - name: Fetch OpenAPI spec
        id: spec
        uses: saasus-platform/github-actions/.github/actions/fetch-openapi-spec@3828a6f1321f954cbb32e8cb3bd253593d5fa0c1 # github-actions main
        with:
          token: ${{ steps.api-token.outputs.token }}
          modules: ${{ env.MODULES }}
          dest: openapi-spec

      # (A) Generate the latest SDK from the fetched spec and build/type-check it.
      - name: (A) Generate latest SDK and build
        env:
          SPEC_DIR: ${{ steps.spec.outputs.spec-dir }}
        run: |
          set -euo pipefail
          # Map normalized <module>.yml to the filenames generate.sh expects
          # (same rule as generate.sh: <module>api.yml, except integration).
          for m in ${MODULES}; do
            if [ "${m}" = "integration" ]; then
              cp "${SPEC_DIR}/${m}.yml" "${m}.yml"
            else
              cp "${SPEC_DIR}/${m}.yml" "${m}api.yml"
            fi
          done
          # Capture the generator output (incl. any warnings) for the artifact.
          sh generate.sh 2>&1 | tee generate.log
          # Fail fast if generation/copy produced no sources for any module
          # (generate.sh runs the generator per module and does not itself abort).
          for m in ${MODULES}; do
            if ! ls "src/main/java/saasus/sdk/${m}/api/"*.java >/dev/null 2>&1; then
              echo "::error::SDK generation failed: src/main/java/saasus/sdk/${m}/api is missing or empty"
              exit 1
            fi
          done
          mvn -B -ntp -DskipTests test-compile

      # Static mode: responses come from the spec's examples, which is the
      # mechanism the API spec uses to make oneOf responses resolvable
      # (saasus-api#2650). Dynamic mode would ignore those examples.
      - name: Start Prism mocks
        uses: saasus-platform/github-actions/.github/actions/setup-prism@3828a6f1321f954cbb32e8cb3bd253593d5fa0c1 # github-actions main
        with:
          spec-dir: ${{ steps.spec.outputs.spec-dir }}
          modules: ${{ steps.spec.outputs.modules }}
          base-port: "4010"

      # (B) Latest SDK spec-compliance: requests accepted + responses deserialize.
      # Runs via the stable `mvn test` entry point (JUnit). The contract suite
      # auto-enumerates every operation and exercises all four call forms; the
      # Prism base URLs come from the setup-prism step (PRISM_URL_<MODULE> env),
      # and request inputs are synthesized from the spec in CONTRACT_SPEC_DIR.
      - name: (B) Latest SDK contract
        env:
          CONTRACT_SPEC_DIR: ${{ steps.spec.outputs.spec-dir }}
          # Latest SDK must cover every spec operation: unmapped operations fail.
          CONTRACT_REQUIRE_COMPLETE: "true"
        run: mvn -B -ntp test

      # Previous release tag of this repository (defaults to the current repo).
      - name: Resolve previous SDK stable tag
        id: old-tag
        uses: saasus-platform/github-actions/.github/actions/resolve-latest-stable-tag@3828a6f1321f954cbb32e8cb3bd253593d5fa0c1 # github-actions main

      - name: Checkout old SDK
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.old-tag.outputs.tag }}
          path: old-sdk

      # (C) Forward compatibility: the previously released SDK must still
      # deserialize responses produced from the LATEST spec. We run the OLD
      # tag's OWN bundled contract suite via `mvn test` (we do NOT copy the
      # current harness into it), so each release is checked with the test it
      # shipped with. Prism was started above from the latest spec, and
      # CONTRACT_SPEC_DIR points at the latest spec, so the old SDK round-trips
      # against the latest contract.
      #
      # Transition period: tags released before the contract suite was bundled
      # have no suite to run, so (C) is skipped until such a release exists.
      - name: (C) Old SDK forward-compat (bundled suite)
        env:
          CONTRACT_SPEC_DIR: ${{ steps.spec.outputs.spec-dir }}
        run: |
          set -euo pipefail
          suite="old-sdk/src/test/java/saasus/sdk/contract/ContractTest.java"
          if [ ! -f "$suite" ]; then
            # TODO(after first release that bundles the contract suite): replace
            # this `exit 0` with `exit 1` so a missing bundled suite fails (C),
            # instead of passing during the transition period.
            echo "::notice::(C) skipped: old SDK tag '${{ steps.old-tag.outputs.tag }}' does not bundle the contract suite yet (transition period)."
            exit 0
          fi
          cd old-sdk
          mvn -B -ntp test

      # Persist the JUnit reports so each case (operation + call form + result +
      # failure reason, in the dynamic-test display names) is kept as evidence.
      # Covers both the latest SDK (B) and the old SDK (C) runs.
      - name: Upload JUnit contract reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: contract-test-reports
          path: |
            target/surefire-reports/**
            old-sdk/target/surefire-reports/**
            generate.log
          if-no-files-found: ignore
